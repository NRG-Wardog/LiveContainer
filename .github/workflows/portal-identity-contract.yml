name: Portal identity diagnostic contract
on:
  workflow_dispatch:
  push:
    branches: [fix/portal-identity-diagnostics, validation/profile-evidence-diagnostics-nov12]
  pull_request:
    paths:
      - SideStoreSupport/SideStore.swift
      - tests/portal_identity/**
      - .ci/comprehensive-diagnostics/generate_wire_fixture.py
      - .github/workflows/portal-identity-contract.yml
permissions:
  contents: read
jobs:
  portal-wire:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - run: python3 -B -m unittest discover -s tests/portal_identity -v

