name: Xcode - Build

on: 
  push:
    branches-ignore: ['integration/issues-oct25']
  pull_request:
  workflow_dispatch:
    inputs: 
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/sidestore-auto-refresh
          ref: c57eac41c7c8436e1ed22bb45aa694bcde2f233c
          persist-credentials: false
          path: harness
      - name: Record candidate and verify immutable dependency recipe
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          test "$(git -C harness rev-parse HEAD)" = c57eac41c7c8436e1ed22bb45aa694bcde2f233c
          git rev-parse HEAD | tee evidence/owner-commit.txt
          git submodule status --recursive | tee evidence/submodules.txt
          xcodebuild -version | tee evidence/xcode.txt
      - name: Generate and qualify canonical OpenSSL inputs without changing gitlinks
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          python3 -B harness/ci/build/openssl/build.py --output "$PWD/lts-host-build" --optimization Os 2>&1 | tee evidence/host-build.log
          python3 -B harness/ci/qualification/crypto/acquire.py --output openssl-qualification-inputs 2>&1 | tee evidence/acquire.log
          python3 -B harness/ci/qualification/crypto/consumer.py acquire --inputs openssl-qualification-inputs 2>&1 | tee evidence/consumer-acquire.log
          python3 -B harness/ci/build/openssl/qualify.py --built lts-host-build --inputs openssl-qualification-inputs --evidence evidence 2>&1 | tee evidence/lts-qualification-driver.log
          python3 -B harness/ci/build/openssl/build_ios.py --output lts-ios-build --archive lts-host-build/openssl-3.5.9.tar.gz --optimization Os 2>&1 | tee evidence/ios-build.log
          python3 -B harness/ci/build/openssl/install_ios.py --built lts-ios-build --consumer . 2>&1 | tee evidence/install.log
          cp lts-host-build/build-receipt.json evidence/host-receipt.json
          cp lts-ios-build/ios-build-receipt.json evidence/ios-receipt.json
          cp GeneratedDependencies/OpenSSL35/provenance.json evidence/consumer-provenance.json
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release 2>&1 | tee evidence/archive.log | xcpretty
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Create IPA
        run: |
          bash -euo pipefail .github/build_github.sh

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa
      
      - name: Upload LiveContainer+SideStore
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa

      - name: Preserve diagnostic receipts and logs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-compile-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release__nightly || github.repository == 'LiveContainer/LiveContainer' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Download a Build Artifact2
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact2 }}
      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
      - name: Update AltStore source
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          commit_sha: ${{ env.COMMIT_SHA }}
          commit_msg: ${{ env.COMMIT_MSG }}
        run: |
          python .github/update_json.py
      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}
            
            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
          files: |
            ${{ needs.build.outputs.artifact }}
            ${{ needs.build.outputs.artifact2 }}
            .github/apps_nightly.json
      - name: Update apps.json in Release 1.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "1.0"
          files: |
            .github/apps_ss_lc.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
