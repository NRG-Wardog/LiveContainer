# Branch-only synthetic filesystem investigation. No app build or release admission.
name: Cache root alias filesystem investigation (not device validation)
on:
  push:
    branches: [validation/cache-root-alias-investigation-20261024]
    paths:
      - '.github/workflows/native-app-compile.yml'
      - '.ci/cache-root-alias-investigation/cache-root-alias.swift'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cache-root-alias-${{ github.ref }}
  cancel-in-progress: false
jobs:
  investigate:
    if: github.repository == 'NRG-Wardog/LiveContainer' && github.ref == 'refs/heads/validation/cache-root-alias-investigation-20261024'
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize bounded investigation evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'workflow_commit=%s\nrun_id=%s\nrun_attempt=%s\nstatus=STARTED_NOT_COMPILED\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > evidence/attempt.txt
      - name: Checkout exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Verify pinned fixture and same native toolchain
        run: |
          set -euo pipefail
          cp harness/.ci/cache-root-alias-investigation/cache-root-alias.swift evidence/cache-root-alias.swift
          python3 -B - <<'PY'
          import hashlib, json, pathlib
          source = pathlib.Path('evidence/cache-root-alias.swift')
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          expected = 'c7e78ba73a79603d923e70591d47e20f81f008c9d917861cc03fe0a29126fb7b'
          receipt = {'schema': 'cache-root-alias-fixture-binding-v1', 'expected_sha256': expected,
                     'actual_sha256': actual, 'source_match': actual == expected,
                     'scope': 'Source-owned synthetic macOS filesystem comparison, not an iOS or device proof.'}
          pathlib.Path('evidence/source-binding.json').write_text(json.dumps(receipt, indent=2) + '\n')
          if actual != expected:
              raise SystemExit('Fixture source SHA-256 differs')
          PY
          { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; swift --version; uname -a; } > evidence/toolchain.txt
          xcodebuild -version | grep -Fx 'Xcode 26.4.1'
      - name: Compile only the source-owned filesystem fixture
        run: |
          set -uo pipefail
          set +e
          swiftc -swift-version 5 -framework CryptoKit evidence/cache-root-alias.swift -o evidence/cache-root-alias \
            > evidence/compile.log 2>&1
          status=$?
          printf '%s\n' "$status" > evidence/compile.exit-code.txt
          cat evidence/compile.log
          exit "$status"
      - name: Compare original and delivered cache behavior on owned synthetic paths
        run: |
          set -uo pipefail
          set +e
          evidence/cache-root-alias evidence/results.json > evidence/runtime.log 2>&1
          status=$?
          printf '%s\n' "$status" > evidence/runtime.exit-code.txt
          cat evidence/runtime.log
          exit "$status"
      - name: Preserve source, JSON, logs and exit status even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cache-root-alias-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/*.json
            evidence/*.log
            evidence/*.txt
            evidence/*.swift
          if-no-files-found: error
          retention-days: 14
