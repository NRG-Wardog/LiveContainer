# Branch-only actual-source inert VPN recovery fixture. No app build or release admission.
name: Cold VPN recovery runtime fixture (not device validation)
on:
  push:
    branches: [validation/cold-vpn-recovery-test-20261024]
    paths:
      - '.github/workflows/native-app-compile.yml'
      - '.ci/cold-vpn-recovery-test/vpn-refresh-recovery.swift'
      - '.ci/cold-vpn-recovery-test/sources.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cold-vpn-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  investigate:
    if: github.repository == 'NRG-Wardog/LiveContainer' && github.ref == 'refs/heads/validation/cold-vpn-recovery-test-20261024'
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize bounded fixture evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'workflow_commit=%s\nrun_id=%s\nrun_attempt=%s\nstatus=STARTED_NOT_COMPILED\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > evidence/attempt.txt
      - name: Checkout exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Verify pinned fixture and same native toolchain
        run: |
          set -euo pipefail
          cp harness/.ci/cold-vpn-recovery-test/vpn-refresh-recovery.swift evidence/vpn-refresh-recovery.swift
          cp harness/.ci/cold-vpn-recovery-test/sources.json evidence/sources.json
          python3 -B - <<'PY'
          import hashlib, json, pathlib
          source = pathlib.Path('evidence/vpn-refresh-recovery.swift')
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          expected = '15cf9a0cf05c380153d261216e22ed03d1d5d8436cf2a15a6f9ab46844488862'
          sources = pathlib.Path('evidence/sources.json')
          sources_actual = hashlib.sha256(sources.read_bytes()).hexdigest()
          sources_expected = '49a847b73780e136278052d739910bec5a200026b434c87c5cbf6deadb039345'
          contract = json.loads(sources.read_text())
          receipt = {'schema': 'cold-vpn-recovery-fixture-binding-v1', 'expected_sha256': expected,
                     'sources_expected_sha256': sources_expected, 'sources_actual_sha256': sources_actual,
                     'actual_sha256': actual, 'source_match': actual == expected,
                     'scope': 'Actual-source macOS policy fixture with inert side effects; not a device VPN activation proof.'}
          pathlib.Path('evidence/source-binding.json').write_text(json.dumps(receipt, indent=2) + '\n')
          if actual != expected or sources_actual != sources_expected or contract['generated_sha256'] != actual:
              raise SystemExit('Fixture source SHA-256 differs')
          PY
          { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; swift --version; uname -a; } > evidence/toolchain.txt
          xcodebuild -version | grep -Fx 'Xcode 26.4.1'
      - name: Compile only the source-owned VPN recovery fixture
        run: |
          set -uo pipefail
          set +e
          swiftc -swift-version 5 -parse-as-library evidence/vpn-refresh-recovery.swift -o evidence/cold-vpn-recovery \
            > evidence/compile.log 2>&1
          status=$?
          printf '%s\n' "$status" > evidence/compile.exit-code.txt
          cat evidence/compile.log
          exit "$status"
      - name: Run actual-source recovery policy with inert side-effect closures
        run: |
          set -uo pipefail
          set +e
          evidence/cold-vpn-recovery evidence/results.json > evidence/runtime.log 2>&1
          status=$?
          printf '%s\n' "$status" > evidence/runtime.exit-code.txt
          cat evidence/runtime.log
          exit "$status"
      - name: Preserve source, JSON, logs and exit status even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cold-vpn-recovery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/*.json
            evidence/*.log
            evidence/*.txt
            evidence/*.swift
          if-no-files-found: error
          retention-days: 14
