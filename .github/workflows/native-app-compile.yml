name: Exact native app compile evidence (not release admission)
on:
  push:
    branches: [validation/native-app-compile-20261020]
    paths:
      - '.github/workflows/native-app-compile.yml'
      - '.ci/native-app-compile/record.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-app-compile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'NRG-Wardog/LiveContainer' && github.ref == 'refs/heads/validation/native-app-compile-20261020'
    runs-on: macos-26
    timeout-minutes: 100
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      RUSTUP_TOOLCHAIN: '1.98.1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_ALLOW_PROTOCOL: https
      GIT_NO_REPLACE_OBJECTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize failure evidence before checkout
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'workflow_commit=%s\nrun_id=%s\nrun_attempt=%s\nstatus=STARTED_NOT_COMPILED\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > evidence/attempt.txt
      - name: Checkout workflow and evidence recorder only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Acquire exact immutable source graph
        run: |
          set -euo pipefail
          mkdir -p evidence sources
          python3 harness/.ci/native-app-compile/record.py acquire 2>&1 | tee evidence/acquisition.log
          python3 harness/.ci/native-app-compile/record.py snapshot acquired
          { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; swift --version; uname -a; } > evidence/toolchain.txt
          xcodebuild -version | grep -Fx 'Xcode 26.4.1'
      - name: Install pinned transport build prerequisites
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" aarch64-apple-ios
          cargo +1.98.1 install --locked bindgen-cli --version 0.72.1 --root "$RUNNER_TEMP/native-tools"
          echo "$RUNNER_TEMP/native-tools/bin" >> "$GITHUB_PATH"
          { rustc +1.98.1 --version --verbose; cargo +1.98.1 --version; "$RUNNER_TEMP/native-tools/bin/bindgen" --version; } >> evidence/toolchain.txt
          test "$(rustc +1.98.1 --version)" = 'rustc 1.98.1 (48a229cea 2026-09-01)'
          test "$(cargo +1.98.1 --version)" = 'cargo 1.98.1 (797e8a9bc 2026-08-05)'
      - name: Compile iOS transport and stage local framework
        run: |
          set -euo pipefail
          cd sources/idevice
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            cargo +1.98.1 build --locked --release --target aarch64-apple-ios --features obfuscate --manifest-path ffi/Cargo.toml \
            2>&1 | tee ../../evidence/transport-build.log
          test -f target/aarch64-apple-ios/release/libidevice_ffi.a
          test -f ffi/idevice.h
          cp ffi/idevice.h swift/include/idevice.h
          # This is a fresh checkout; replace only the pre-existing binary output directory.
          rm -rf swift/IDevice.xcframework
          xcodebuild -create-xcframework -library target/aarch64-apple-ios/release/libidevice_ffi.a \
            -headers swift/include -output swift/IDevice.xcframework 2>&1 | tee ../../evidence/transport-framework.log
          cd ../..
          mux=sources/SideStore/Dependencies/minimuxer/DeviceGateway/LocalBinary
          mkdir -p "$mux"
          test ! -e "$mux/IDevice.xcframework"
          cp -R sources/idevice/swift/IDevice.xcframework "$mux/IDevice.xcframework"
      - name: Capture genuine app lock transition to exact AnisetteKit
        run: |
          set -euo pipefail
          # Fresh Xcode resolution is allowed to update the app lock, then the recorder
          # admits only AK e6e9 -> 56f9 plus actual resolver originHash. No other pin may move.
          test ! -e "$RUNNER_TEMP/native-SideStore"
          test ! -L "$RUNNER_TEMP/native-SideStore"
          GIT_ALLOW_PROTOCOL=https:file xcodebuild -resolvePackageDependencies -disablePackageRepositoryCache \
            -project sources/SideStore/AltStore.xcodeproj -scheme SideStore \
            -derivedDataPath "$RUNNER_TEMP/native-SideStore" 2>&1 | tee evidence/SideStore-resolution.log
          python3 harness/.ci/native-app-compile/record.py seal-resolution
          python3 harness/.ci/native-app-compile/record.py verify-resolved
          python3 harness/.ci/native-app-compile/record.py snapshot compiler-inputs
      - name: Compile unsigned LiveContainer app and extensions
        run: |
          set -euo pipefail
          xcodebuild -project sources/LiveContainer/LiveContainer.xcodeproj -scheme LiveContainer \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/native-LiveContainer" \
            -resultBundlePath "$RUNNER_TEMP/native-LiveContainer-build.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee evidence/LiveContainer-build.log
          printf '0\n' > evidence/LiveContainer-build.exit-code.txt
      - name: Compile unsigned SideStore app and extensions
        run: |
          set -euo pipefail
          xcodebuild -project sources/SideStore/AltStore.xcodeproj -scheme SideStore \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/native-SideStore" \
            -resultBundlePath "$RUNNER_TEMP/native-SideStore-build.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee evidence/SideStore-build.log
          printf '0\n' > evidence/SideStore-build.exit-code.txt
      - name: Verify unchanged compiler inputs and record outputs
        run: |
          set -euo pipefail
          python3 harness/.ci/native-app-compile/record.py verify-resolved
          python3 harness/.ci/native-app-compile/record.py snapshot after-build
          cmp evidence/compiler-inputs.json evidence/after-build.json
          python3 harness/.ci/native-app-compile/record.py receipt
      - name: Preserve evidence, including failures (not app products)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-app-compile-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
