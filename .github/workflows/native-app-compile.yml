# Investigation only: never app compilation, release, package or native admission.
name: TEST ONLY - delivered install chain investigation (no native admission)
on:
  push:
    branches: [validation/install-chain-fixture-20261024]
    paths:
      - '.github/workflows/native-app-compile.yml'
      - '.ci/install-chain-fixture/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-only-install-chain-${{ github.ref }}
  cancel-in-progress: false
jobs:
  investigate:
    if: github.repository == 'NRG-Wardog/LiveContainer' && github.ref == 'refs/heads/validation/install-chain-fixture-20261024'
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_ALLOW_PROTOCOL: https
      GIT_NO_REPLACE_OBJECTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize investigation failure evidence before checkout
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'workflow_commit=%s\nrun_id=%s\nrun_attempt=%s\nstatus=TEST_ONLY_STARTED_NO_NATIVE_ADMISSION\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > evidence/attempt.txt
      - name: Checkout fixed harness only without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Investigate delivered install chain with source-owned fake effects only
        run: |
          set -euo pipefail
          python3 -B harness/.ci/install-chain-fixture/run.py \
            --sources sources --recorder harness/.ci/native-app-compile/record.py \
            --output evidence/install-chain-fixture
      - name: Preserve all investigation evidence including failures - no app products
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TEST-ONLY-install-chain-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
