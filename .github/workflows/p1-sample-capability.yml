name: P1 owned sample capability only

# Exact branch; no native build, simulator, XCTest, UI capture or helper sample.
on:
  push:
    branches: [validation/p1-sample-capability]
permissions:
  contents: read
concurrency:
  group: p1-sample-capability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capability:
    if: github.repository == 'NRG-Wardog/LiveContainer' && github.ref == 'refs/heads/validation/p1-sample-capability'
    runs-on: macos-26
    timeout-minutes: 3
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      APPROVED_CLOSURE_SHA256: '24d2a585953732625ed345cd6f35453cafdad0e9f407e06aeea9426ba081b77c'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false
      - name: Verify exact diagnostic closure
        run: |
          set -euo pipefail
          python3 -B ci/p1/sample_capability/run.py --seal "$APPROVED_CLOSURE_SHA256" --verify-only
      - name: Compile and sample one bounded native benign probe
        id: diagnostic
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 -B ci/p1/sample_capability/run.py --seal "$APPROVED_CLOSURE_SHA256" --output "$GITHUB_WORKSPACE/p1-sample-evidence"
      - name: Preserve bounded metadata only
        if: always() && steps.diagnostic.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-sample-capability-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            p1-sample-evidence/helper-sample.json
            p1-sample-evidence/process-registry.json
            p1-sample-evidence/quiescence.json
          if-no-files-found: error
          retention-days: 14
