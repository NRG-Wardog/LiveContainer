              if root.is_symlink() or not root.is_dir(): raise ValueError('Invalid transfer root')
              inventory(root)
              receipt = json.loads((root / 'evidence/receipt.json').read_text())
              if (receipt['status'] != 'COMPILE_ONLY_PASS_REQUIRES_REVIEW' or
                  str(receipt['run_id']) != os.environ['COMPILE_RUN'] or
                  str(receipt['run_attempt']) != os.environ['COMPILE_ATTEMPT'] or
                  receipt['workflow_commit'] != os.environ['COMPILE_COMMIT']):
                  raise ValueError('Retained receipt mismatch')
              if receipt['requested_graph'] != expected_graph:
                  raise ValueError('Retained source graph differs from exact reviewed pins')
              for name, expected_hash in receipt['evidence_sha256'].items():
                  if pathlib.PurePosixPath(name).name != name: raise ValueError('Invalid evidence name')
                  evidence_file = root / 'evidence' / name
                  if evidence_file.is_symlink() or not evidence_file.is_file(): raise ValueError('Invalid evidence file')
                  if hashlib.sha256(evidence_file.read_bytes()).hexdigest() != expected_hash:
                      raise ValueError('Compile evidence checksum mismatch: ' + name)
              graph_file = root / 'evidence/requested-graph.json'
              if ('requested-graph.json' not in receipt['evidence_sha256'] or
                  graph_file.is_symlink() or not graph_file.is_file() or
                  json.loads(graph_file.read_text()) != expected_graph):
                  raise ValueError('Retained graph evidence differs from exact reviewed pins')
              report_dir = root / 'evidence/comprehensive-diagnostics'
              report = report_dir / 'report.json'
              if report_dir.is_symlink() or not report_dir.is_dir() or report.is_symlink() or not report.is_file():
                  raise ValueError('Invalid comprehensive diagnostic report path')
              report_hash = hashlib.sha256(report.read_bytes()).hexdigest()
              if (report_hash != receipt.get('comprehensive_diagnostics_report_sha256') or
                  report_hash != os.environ['REVIEWED_COMPREHENSIVE_REPORT_SHA256']):
                  raise ValueError('Comprehensive diagnostic report checksum mismatch')
              diagnostic_report = json.loads(report.read_text())
              if diagnostic_report.get('status') != 'SOURCE_OWNED_FAKE_DIAGNOSTICS_PASS_NOT_RUNTIME_VALIDATION':
                  raise ValueError('Comprehensive diagnostic report is not passing')
              # The exact independently reviewed report remains authoritative.
              # Require the added narrow suites and their frozen case closure too;
              # these are fake-boundary checks, never on-device sign-in evidence.
              expected_suites = ['legacy-response-core', 'auth-request', 'iloader-auth-parity', 'iloader-onboarding-scope', 'profile-provenance', 'wire-copy', 'placed-pairing', 'deferred-device-setup']
              expected_commands = ["legacy-generate", "legacy-compile", "legacy-run", "auth-source", "auth-generate", "auth-compile", "auth-run", "iloader-source", "iloader-generate", "iloader-compile", "iloader-run", "onboarding-source", "onboarding-generate", "onboarding-compile", "onboarding-run", "profile-source", "profile-generate", "profile-compile", "profile-run", "wire-source", "wire-generate", "wire-service-compile", "wire-host-compile", "wire-service-run", "wire-host-run", "pairing-source", "pairing-generate", "pairing-compile", "pairing-run", "recovery-source", "recovery-generate", "recovery-compile", "recovery-run", "deferred-prior-extract", "deferred-prior-generate", "deferred-prior-compile", "deferred-prior-run", "deferred-source", "deferred-generate", "deferred-compile", "deferred-run"]
              expected_setup_cases = {"deferred-device-setup": ["background_retry_reauth_and_skip_modes_never_defer", "cancellation_before_or_during_activation_never_succeeds", "configured_success_registers_and_completes", "deferred_completion_skips_resign_and_postauth", "failed_activation_never_publishes_deferred_success", "fresh_pem_real_proof_finalization_terminal_and_export", "missing_pairing_defers_after_certificate_and_checked_activation", "network_udid_portal_and_certificate_failures_never_defer", "present_invalid_empty_and_unreadable_never_defer", "real_proof_rejects_wrong_malformed_and_truncated_keys", "reloaded_pkcs1_and_pkcs8_real_proof_finalization_terminal_and_export", "reset_pairing_defers_without_adopting_stale_record", "service_terminal_and_export_reject_mismatched_ownership", "stale_identity_wrong_team_or_key_never_activates", "wire_outcome_allowlist_preserves_incomplete_journal"], "placed-pairing": ["activation-gate-serializes", "actual-live-query-ready", "boot-and-status-preserve-reset", "cached-device-id-is-not-live-proof", "cancelled-startup-retains-adopted-file", "changed-placement-after-commit-stops-transport", "changed-preference-after-commit-not-overwritten", "changed-state-after-live-query-not-ready", "cleanup-uncertainty-retains-file-and-hold", "commit-cancellation-preserves-reset", "conflicting-destination-preserved", "diagnostics-do-not-contain-pairing-data", "different-live-device-not-ready", "directory-replacement-rejected", "failed-live-identity-retains-adopted-file", "failed-publication-cleanup-quarantines-leftover", "failed-startup-retains-adopted-file", "fresh-place-explicit-adoption", "invalid-placement-no-mutation", "oversized-file-rejected", "queued-boot-does-not-override-cleanup-uncertain", "queued-boot-does-not-retry-not-ready", "reset-with-no-file-preserved", "stale-before-commit-no-adoption", "symlink-directory-rejected", "symlink-placement-rejected", "verified-existing-copy-adopted"]}
              if (set(expected_setup_cases) != {'placed-pairing', 'deferred-device-setup'} or
                  any(not isinstance(names, list) or not names or
                      any(not isinstance(name, str) or not name for name in names) or
                      len(names) != len(set(names)) for names in expected_setup_cases.values())):
                  raise ValueError('Frozen setup case contract is incomplete')
              if diagnostic_report.get('suites') != expected_suites:
                  raise ValueError('Consolidated diagnostic suite closure differs')
              commands = diagnostic_report.get('commands', [])
              if ([row.get('name') for row in commands] != expected_commands or
                  any(row.get('exit_code') != 0 for row in commands)):
                  raise ValueError('Consolidated diagnostic command closure differs')
              for key in ('live_authentication_executed', 'guest_binary_executed',
                          'native_provider_executed', 'native_linked_tests_executed'):
                  if diagnostic_report.get(key) is not False:
                      raise ValueError('Forbidden runtime claim in retained diagnostic report')
              if (diagnostic_report.get('source_owned_fake_authentication_executed') is not True or
                  diagnostic_report.get('source_input_bytes_unchanged') is not True or
                  diagnostic_report.get('source_inputs_before') != diagnostic_report.get('source_inputs_after')):
                  raise ValueError('Missing fake-only or source immutability evidence')
              exports = diagnostic_report.get('fixture_exports', {})
              if set(exports) != {'iloader-auth-parity', 'iloader-onboarding-scope',
                                 'placed-pairing', 'deferred-device-setup'}:
                  raise ValueError('Retained fixture export closure differs')
              for suite, names in expected_setup_cases.items():
                  path = report_dir / suite / 'cases.json'
                  if path.is_symlink() or not path.is_file() or path.parent.is_symlink():
                      raise ValueError('Missing or linked setup case export')
                  case_bytes = path.read_bytes()
                  value = json.loads(case_bytes)
                  cases = value.get('cases')
                  if (value.get('schema') != suite + '-cases-v1' or value.get('fake_only') is not True or
                      not isinstance(cases, list) or any(not isinstance(name, str) for name in cases) or
                      len(cases) != len(set(cases)) or sorted(cases) != sorted(names)):
                      raise ValueError('Setup case export differs from frozen source contract')
                  expected = {'schema': suite + '-cases-v1', 'fake_only': True, 'names': cases,
                              'count': len(cases), 'sha256': hashlib.sha256(case_bytes).hexdigest()}
                  if exports.get(suite) != expected:
                      raise ValueError('Setup case receipt differs from retained bytes')
              # Narrow recovery identities supplement the exact independently admitted report.
              expected_recovery = json.loads(r'''{"baseline_store_sha256": "7f2e5adb99e4e990513152d59c2e7e931d871e4e3c5bbc9f32344a180b4ac19a", "contract_sha256": "4f9066eaad6e520580f158722d4e84606423077b774d96084b953c0ab64b9850", "deferred_baseline": {"input_sha256": {"LiveContainer/LiveContainerSwiftUI/Views/V3UnifiedShell.swift": "9767154ceb1cb7c8ba55548554fd56c675bdd1946824f9480266e3c8f8f8b844", "LiveContainer/SideStoreSupport/SideStore.swift": "500c90f61be0f1b41c4e7ff785ff84080fff56f59a4392123ac8660a549c7b05", "SideStore/AltStore/AppDelegate.swift": "0d78665e470757d56ac1977fcb9d443fc1c43d1d0ed296a21092c02ec1fcac7f", "SideStore/AltStore/Core/Components/Keychain.swift": "9d617b70b9ab8f77e336a9788953eee837692738c08e7c2abae79b286e3265dd", "SideStore/SideStore/Core/Operations/StandaloneOperations/SignInOperation.swift": "e972f41a596e83602f1a6cec3914efb8ab044291abf2f2a31aedc4473f0550c4", "SideStore/SideStore/Core/Pairing/PairingFileManager.swift": "83320f94fcf086627c1f7c104469eacc8852ca4d328916c9a299cfadfb506274"}, "owners": {"LiveContainer": {"commit": "c20d8289bb72fdca07dd08506c37ead6d9da37da", "tree": "5e92e4275c0b59e48662be9966ef8c2a3f7e0e04"}, "SideStore": {"commit": "6c8ae29c0a9448a83ca710ea484d91d6b2d143cd", "tree": "f4955c1e4a510b10b0022f2dc7e81ae4002b56bd"}}}, "pairing_recovery_case_names": ["ack-cancel-retains-owner", "ack-cancelAfterResponse-retains-owner", "ack-epochChanged-retains-owner", "ack-fail-retains-owner", "ack-falseAck-retains-owner", "ack-serviceChanged-retains-owner", "ack-wrongTarget-retains-owner", "baseline-dispatched-snapshot-ack-stale-owner-reproduced", "certificate-import-safe-copy-and-stale-suffix", "cleanup-uncertainty-retains-durable-and-host-owner", "correlation-inner-no-request-context", "correlation-outer-no-request-context", "correlation-unallowlistedOperation-no-request-context", "exact-ack-plus-quiescent-snapshot-retires-owner", "failed-repeat-ack-retains-only-original-success-proof", "finite-recovery-refusal-causes-preserve-journal", "localized-command-recovery-deferred-en", "localized-command-recovery-deferred-he", "localized-command-recovery-deferred-zh-Hans", "localized-command-recovery-deferred-zh-Hant", "snapshot-activeMutation-retains-owner", "snapshot-busy-retains-owner", "snapshot-differentOperation-retains-owner", "snapshot-malformedDirect-retains-owner", "snapshot-missingAck-retains-owner", "snapshot-newerOwner-retains-owner", "snapshot-postAckEpochChanged-retains-owner", "snapshot-unreadable-retains-owner", "wire-classify-copy-directRecoveryInspect", "wire-classify-copy-directRecoveryReconcile", "wire-classify-copy-pairingUsePlaced"], "pairing_recovery_fixture_inputs": {"generate_pairing_recovery_fixture.py": "5caa33d5053b2e52088f597a736347569841dff375fecff6fc1d965ed701a91c", "generate_wire_fixture.py": "eae2b298aa9c4a23b4aa8bacc0e72a0645ec6acdcae8d38c3391c7dc468c4683", "pairing_recovery_harness.swift": "f28fd762d13ada3419e37b672fe54c863b0d29778b261437760cbda1e1bbcb87", "test_pairing_recovery_contract.py": "085c00713fc72efb7d56bae8753b5d053b492801418368a92759ea39433fb31c"}, "pairing_recovery_input_sha256": {"catalog": "6db2df7a72da5384f0a255dba6975549ec0765a700d79a5717af9196c073110d", "host": "1b289b344701654498a3fab9e3a8bf2f7c8b43536cb65b37f2b916b75b470527", "localization": "42a1b385d22be1a59854551faff25855be01c73cf1e6cd85dab66b41e247aba8", "service": "51e30757931bcf6c82f77bebdca98765f91d6eae9e600e5c891c2a051d660da1", "settings": "53e9141cd2ef1e3aaccb74e099cddfed9ed8451b0dbbca0ac3c7a3b53fe0b84a", "ui": "bfad75629bb4fe6cdd8b3cfa2b60346eff8d7d6ebf50f892e6acea4e697ecfa2"}, "pairing_recovery_outputs": ["fixture.swift", "TestLocalization.bundle/Info.plist", "TestLocalization.bundle/en.lproj/Localizable.strings", "TestLocalization.bundle/he.lproj/Localizable.strings", "TestLocalization.bundle/zh-Hans.lproj/Localizable.strings", "TestLocalization.bundle/zh-Hant.lproj/Localizable.strings"], "source_input_count": 93, "system_crypto_boundary": {"frameworks": ["Security", "CryptoKit"], "native_vendor_provider": false, "personal_keys_or_certificates": false, "platform": "darwin", "real_keychain_access": false, "synthetic_in_memory_identities_only": true}}''')
              if (diagnostic_report.get('contract_sha256') != expected_recovery['contract_sha256'] or
                  len(diagnostic_report.get('source_inputs_before', {})) != expected_recovery['source_input_count'] or
                  diagnostic_report.get('system_crypto_synthetic_fixture_executed') is not True or
                  diagnostic_report.get('system_crypto_boundary') != expected_recovery['system_crypto_boundary']):
                  raise ValueError('Missing bounded synthetic Security/CryptoKit recovery evidence')
              def retained_bytes(relative):
                  path = report_dir / relative
                  if not path.is_file() or path.is_symlink() or any(p.is_symlink() for p in path.parents):
                      raise ValueError('Missing or linked recovery evidence: ' + relative)
                  return path.read_bytes()
              def retained_hash(relative):
                  return hashlib.sha256(retained_bytes(relative)).hexdigest()
              prior = diagnostic_report.get('deferred_prior_pem_rejection', {})
              baseline = expected_recovery['deferred_baseline']
              prior_path = 'deferred-prior-pem/baseline-sources.json'
              prior_expected = {'schema': 'deferred-prior-pem-sources-v1', 'origin': 'exact-local-git-objects',
                                'owners': baseline['owners'], 'input_sha256': baseline['input_sha256'],
                                'network': False, 'target_execution': False}
              if (json.loads(retained_bytes(prior_path)) != prior_expected or
                  prior.get('source_receipt_path') != prior_path or prior.get('source_receipt_sha256') != retained_hash(prior_path) or
                  prior.get('owners') != baseline['owners'] or prior.get('input_sha256') != baseline['input_sha256'] or
                  prior.get('required_marker') != 'DEFERRED_PRIOR_PEM_REJECTION_REPRODUCED' or
                  prior.get('system_crypto_boundary') != expected_recovery['system_crypto_boundary']):
                  raise ValueError('Prior exact delivered PEM rejection receipt differs')
              for name, digest in baseline['input_sha256'].items():
                  if retained_hash('deferred-prior-pem/sources/' + name) != digest:
                      raise ValueError('Prior delivered source bytes differ')
              prior_extraction = 'deferred-prior-pem/deferred-device-setup/source-evidence.json'
              if prior.get('extraction') != {'path': prior_extraction, 'sha256': retained_hash(prior_extraction)}:
                  raise ValueError('Prior actual-source extraction receipt differs')
              recovery_path = 'pairing-recovery/cases.json'
              recovery = json.loads(retained_bytes(recovery_path))
              names = recovery.get('cases')
              if (recovery.get('schema') != 'pairing-recovery-cases-v1' or recovery.get('status') != 'pass' or
                  recovery.get('fake_only') is not True or recovery.get('native_pairing_executed') is not False or
                  not isinstance(names, list) or any(not isinstance(name, str) for name in names) or
                  len(names) != len(set(names)) or sorted(names) != sorted(expected_recovery['pairing_recovery_case_names'])):
                  raise ValueError('Actual pairing recovery case closure differs')
              if diagnostic_report.get('pairing_recovery_cases') != {
                      'schema': 'pairing-recovery-cases-v1', 'fake_only': True, 'names': names,
                      'count': len(names), 'sha256': retained_hash(recovery_path)}:
                  raise ValueError('Pairing recovery case receipt differs')
              recovery_source_path = 'pairing-recovery/sources.json'
              recovery_source = json.loads(retained_bytes(recovery_source_path))
              outputs = {name: retained_hash('pairing-recovery/' + name) for name in expected_recovery['pairing_recovery_outputs']}
              if (recovery_source.get('schema') != 'pairing-recovery-sources-v1' or
                  recovery_source.get('status') != 'generated_not_compiled' or
                  recovery_source.get('input_sha256') != expected_recovery['pairing_recovery_input_sha256'] or
                  recovery_source.get('fixture_inputs') != expected_recovery['pairing_recovery_fixture_inputs'] or
                  recovery_source.get('baseline_store_sha256') != expected_recovery['baseline_store_sha256'] or
                  recovery_source.get('output_sha256') != outputs or recovery_source.get('fixture_sha256') != outputs['fixture.swift'] or
                  sorted(recovery_source.get('case_names', [])) != sorted(names)):
                  raise ValueError('Pairing recovery actual-source or generated closure differs')
              if diagnostic_report.get('pairing_recovery_extraction') != {
                      'path': recovery_source_path, 'sha256': retained_hash(recovery_source_path),
                      'output_sha256': outputs, 'baseline_store_sha256': expected_recovery['baseline_store_sha256']}:
                  raise ValueError('Pairing recovery extraction receipt differs')
              by_name = {row['name']: row for row in commands}
              for command in ('deferred-prior-compile', 'deferred-compile'):
                  argv = by_name[command]['argv']
                  if [argv[i + 1] for i, value in enumerate(argv[:-1]) if value == '-framework'] != ['Security', 'CryptoKit']:
                      raise ValueError('Synthetic cryptographic framework closure differs')
              for command, marker in (('deferred-prior-run', 'DEFERRED_PRIOR_PEM_REJECTION_REPRODUCED'),
                                      ('recovery-run', 'PAIRING_RECOVERY_BOUNDARY_PASS'),
                                      ('deferred-run', 'DEFERRED_DEVICE_SETUP_FIXTURE_PASS')):
                  row = by_name[command]
                  raw = retained_bytes(row['log'])
                  if (row.get('success_marker') != marker or hashlib.sha256(raw).hexdigest() != row['stdout_sha256'] or
                      raw.decode('utf-8').splitlines().count(marker) != 1):
                      raise ValueError('Required source-extracted recovery success marker differs')
              actual_artifacts = {}
              for path in sorted(report_dir.rglob('*')):
                  if path.is_symlink(): raise ValueError('Symlinked comprehensive diagnostic artifact')
                  if path.is_dir(): continue
                  relative = path.relative_to(report_dir).as_posix()
                  if relative == 'report.json': continue
                  if not path.is_file(): raise ValueError('Nonregular comprehensive diagnostic artifact')
                  actual_artifacts[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
              expected_artifacts = diagnostic_report.get('artifact_sha256')
              if not isinstance(expected_artifacts, dict) or not expected_artifacts or actual_artifacts != expected_artifacts:
                  raise ValueError('Retained comprehensive diagnostic artifacts missing or changed')
              receipts.append(receipt)
              app = root / 'Products' / (owner + '.app')
              manifest = json.loads((root / 'retained-files.json').read_text())
              if inventory(app) != manifest['app']: raise ValueError('Retained app inventory differs')
              expected = json.loads((root / 'evidence/product-hashes.json').read_text())[owner]
              actual = {p.relative_to(app).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in sorted(app.rglob('*')) if p.is_file()}
              if actual != expected: raise ValueError('Retained app differs from native compilation')
          if receipts[0] != receipts[1]: raise ValueError('Apps come from different compile receipts')
          for owner in ('LiveContainer', 'SideStore'):
              path = pathlib.Path('unpacked') / owner / ('native-transfer-' + owner) / 'evidence/receipt.json'
              if hashlib.sha256(path.read_bytes()).hexdigest() != os.environ['REVIEWED_NATIVE_RECEIPT_SHA256']:
                  raise ValueError('Retained native receipt checksum differs from independent review')
          pathlib.Path('package-evidence/native-receipt.json').write_text(json.dumps(receipts[0], indent=2))
          PY
      - name: Package using existing verified combined wrapper
        shell: bash
        run: |
          set -euo pipefail
          # Formula metadata is checked before bottle-only acquisition; never fetch the git source.
          HOMEBREW_NO_AUTO_UPDATE=1 brew info --json=v2 --formula homebrew/core/ldid > package-evidence/ldid-formula.json
          cat > package-evidence/validate_ldid_bottle.py <<'PY'
          import json, pathlib, sys
          
          BOTTLE_SHA256 = 'b1deffb6e575a4996e31cef6cbc56aa009f5eea67b73b437f6aea597198866a6'
          SOURCE_REVISION = 'a23f0faadd29ec00a6b7fb2498c3d15af15a7100'
          
          def validate(formula_json, receipt=None, keg_version=None):
              formulas = formula_json['formulae']
              if len(formulas) != 1: raise ValueError('Unexpected formula count')
              formula = formulas[0]
              if formula['name'] != 'ldid' or formula['tap'] != 'homebrew/core':
                  raise ValueError('Not official Homebrew ldid')
              source = formula['urls']['stable']
              if (source['url'] != 'git://git.saurik.com/ldid.git' or source['tag'] != 'v2.1.5' or
                  source['revision'] != SOURCE_REVISION):
                  raise ValueError('Reviewed source identity differs; no source fetch is allowed')
              bottle = formula['bottle']['stable']['files']['arm64_tahoe']
              if (bottle['sha256'] != BOTTLE_SHA256 or
                  bottle['url'] != 'https://ghcr.io/v2/homebrew/core/ldid/blobs/sha256:' + BOTTLE_SHA256):
                  raise ValueError('Reviewed official HTTPS bottle differs')
              if formula['versions']['stable'] != '2.1.5' or formula['revision'] != 2:
                  raise ValueError('Reviewed ldid formula version differs')
              if receipt is not None:
                  if (receipt['poured_from_bottle'] is not True or receipt['built_as_bottle'] is not True or
                      receipt['arch'] != 'arm64' or receipt['source']['tap'] != 'homebrew/core' or
                      receipt['source']['spec'] != 'stable' or receipt['source']['scm_revision'] != SOURCE_REVISION or
                      receipt['source']['versions']['stable'] != '2.1.5'):
                      raise ValueError('Installed bottle receipt differs')
                  installed = [v for v in formula['installed'] if v['version'] == keg_version]
                  if (keg_version != '2.1.5_2' or len(installed) != 1 or
                      installed[0]['poured_from_bottle'] is not True):
                      raise ValueError('Installed ldid keg differs')
          
          if __name__ == '__main__':
              formula = json.load(open('package-evidence/ldid-formula.json'))
              if len(sys.argv) == 1:
                  validate(formula)
              else:
                  prefix = pathlib.Path(sys.argv[1]).resolve(strict=True)
                  binary = prefix / 'bin/ldid'
                  if not binary.is_file() or not binary.resolve(strict=True).is_relative_to(prefix):
                      raise ValueError('ldid binary is outside official installed keg')
                  validate(formula, json.load(open('package-evidence/ldid-install-receipt.json')), prefix.name)
          PY
          python3 package-evidence/validate_ldid_bottle.py
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --force-bottle --formula homebrew/core/ldid
          HOMEBREW_NO_AUTO_UPDATE=1 brew info --json=v2 --formula homebrew/core/ldid > package-evidence/ldid-formula.json
          LDID_PREFIX="$(brew --prefix homebrew/core/ldid)"
          cp "$LDID_PREFIX/INSTALL_RECEIPT.json" package-evidence/ldid-install-receipt.json
          python3 package-evidence/validate_ldid_bottle.py "$LDID_PREFIX"
          export PATH="$LDID_PREFIX/bin:$PATH"
          { xcodebuild -version; brew list --versions ldid; shasum -a 256 "$LDID_PREFIX/bin/ldid"; } > package-evidence/toolchain.txt
          # Intentional packaging metadata only, after retained input verification.
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, re
          commit = 'e375ffda1afb160da332833baae404845ec60476'
          if not re.fullmatch('[0-9a-f]{40}', commit):
              raise ValueError('Invalid native builder commit')
          records = []
          for owner in ('LiveContainer', 'SideStore'):
              app = pathlib.Path('unpacked') / owner / ('native-transfer-' + owner) / 'Products' / (owner + '.app')
              paths = [app / 'Info.plist'] + sorted(app.glob('PlugIns/*.appex/Info.plist'))
              for path in paths:
                  if path.is_symlink() or not path.is_file():
                      raise ValueError('Invalid application metadata path')
                  before = path.read_bytes()
                  value = plistlib.loads(before)
                  previous = value.get('LCBuilderCommit')
                  value['LCBuilderCommit'] = commit
                  fmt = plistlib.FMT_BINARY if before.startswith(b'bplist00') else plistlib.FMT_XML
                  after = plistlib.dumps(value, fmt=fmt, sort_keys=False)
                  path.write_bytes(after)
                  if plistlib.loads(path.read_bytes()) != value:
                      raise ValueError('Builder metadata write verification failed')
                  records.append({'path': str(path), 'previous': previous, 'LCBuilderCommit': commit,
                      'CFBundleShortVersionString': value.get('CFBundleShortVersionString'),
                      'CFBundleVersion': value.get('CFBundleVersion'),
                      'before_sha256': hashlib.sha256(before).hexdigest(),
                      'after_sha256': hashlib.sha256(after).hexdigest()})
          pathlib.Path('package-evidence/builder-stamping.json').write_text(json.dumps({
              'meaning': 'Native compile workflow commit; dependency owners remain identified by compile receipt',
              'intentional_post_retention_metadata_change': True, 'files': records}, indent=2) + '\n')
          # Product label is separate from the unchanged embedded upstream versions.
          receipt = json.loads(pathlib.Path('package-evidence/native-receipt.json').read_text())
          label = {
              'product_version': '6.0',
              'channel': 'experimental',
              'label': '6.0 pairing and deferred setup experimental',
              'native_compile_run': str(receipt['run_id']),
              'native_compile_attempt': str(receipt['run_attempt']),
              'native_workflow_commit': commit,
              'source_graph': receipt['requested_graph'],
              'retained_input_versions_unchanged': True,
              'retained_input_bundle_versions': [{k: row[k] for k in
                  ('path', 'CFBundleShortVersionString', 'CFBundleVersion')} for row in records],
              'scope': 'Experimental combined package; compile/static validation is not device sign-in proof.'
          }
          label_bytes = (json.dumps(label, indent=2, sort_keys=True) + '\n').encode()
          pathlib.Path('package-evidence/build-label.json').write_bytes(label_bytes)
          pathlib.Path('diagnostic/build-label.json').write_bytes(label_bytes)
          PY
          python3 builder/scripts/package_livecontainer_combined.py \
            --root host \
            --host unpacked/LiveContainer/native-transfer-LiveContainer/Products/LiveContainer.app \
            --side unpacked/SideStore/native-transfer-SideStore/Products/SideStore.app \
            --output diagnostic/LiveContainer-SideStore-6.0-pairing-deferred-setup-experimental.ipa 2>&1 | tee package-evidence/packaging.log
          shasum -a 256 diagnostic/LiveContainer-SideStore-6.0-pairing-deferred-setup-experimental.ipa > diagnostic/SHA256SUMS
          stat -f%z diagnostic/LiveContainer-SideStore-6.0-pairing-deferred-setup-experimental.ipa > diagnostic/size-bytes.txt
          test "$(cat diagnostic/size-bytes.txt)" -lt 524288000
          # Wrapper itself checks conversion, entitlements, identities and resources.
          # This is a diagnostic candidate, not proof that sign-in works on device.
      - name: Preserve packaging evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-package-evidence-${{ github.run_id }}
          path: package-evidence/
          if-no-files-found: error
      - name: Retain successfully verified diagnostic IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-ipa-${{ github.run_id }}
          path: diagnostic/
          compression-level: 0
          if-no-files-found: error
