                  bottle['url'] != 'https://ghcr.io/v2/homebrew/core/ldid/blobs/sha256:' + BOTTLE_SHA256):
                  raise ValueError('Reviewed official HTTPS bottle differs')
              if formula['versions']['stable'] != '2.1.5' or formula['revision'] != 2:
                  raise ValueError('Reviewed ldid formula version differs')
              if receipt is not None:
                  if (receipt['poured_from_bottle'] is not True or receipt['built_as_bottle'] is not True or
                      receipt['arch'] != 'arm64' or receipt['source']['tap'] != 'homebrew/core' or
                      receipt['source']['spec'] != 'stable' or receipt['source']['scm_revision'] != SOURCE_REVISION or
                      receipt['source']['versions']['stable'] != '2.1.5'):
                      raise ValueError('Installed bottle receipt differs')
                  installed = [v for v in formula['installed'] if v['version'] == keg_version]
                  if (keg_version != '2.1.5_2' or len(installed) != 1 or
                      installed[0]['poured_from_bottle'] is not True):
                      raise ValueError('Installed ldid keg differs')
          
          if __name__ == '__main__':
              formula = json.load(open('package-evidence/ldid-formula.json'))
              if len(sys.argv) == 1:
                  validate(formula)
              else:
                  prefix = pathlib.Path(sys.argv[1]).resolve(strict=True)
                  binary = prefix / 'bin/ldid'
                  if not binary.is_file() or not binary.resolve(strict=True).is_relative_to(prefix):
                      raise ValueError('ldid binary is outside official installed keg')
                  validate(formula, json.load(open('package-evidence/ldid-install-receipt.json')), prefix.name)
          PY
          python3 package-evidence/validate_ldid_bottle.py
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --force-bottle --formula homebrew/core/ldid
          HOMEBREW_NO_AUTO_UPDATE=1 brew info --json=v2 --formula homebrew/core/ldid > package-evidence/ldid-formula.json
          LDID_PREFIX="$(brew --prefix homebrew/core/ldid)"
          cp "$LDID_PREFIX/INSTALL_RECEIPT.json" package-evidence/ldid-install-receipt.json
          python3 package-evidence/validate_ldid_bottle.py "$LDID_PREFIX"
          export PATH="$LDID_PREFIX/bin:$PATH"
          { xcodebuild -version; brew list --versions ldid; shasum -a 256 "$LDID_PREFIX/bin/ldid"; } > package-evidence/toolchain.txt
          # Intentional packaging metadata only, after retained input verification.
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, re
          commit = 'deba71bcac44b1adc1da95c7b2db2f60a2300211'
          if not re.fullmatch('[0-9a-f]{40}', commit):
              raise ValueError('Invalid native builder commit')
          records = []
          for owner in ('LiveContainer', 'SideStore'):
              app = pathlib.Path('unpacked') / owner / ('native-transfer-' + owner) / 'Products' / (owner + '.app')
              paths = [app / 'Info.plist'] + sorted(app.glob('PlugIns/*.appex/Info.plist'))
              for path in paths:
                  if path.is_symlink() or not path.is_file():
                      raise ValueError('Invalid application metadata path')
                  before = path.read_bytes()
                  value = plistlib.loads(before)
                  previous = value.get('LCBuilderCommit')
                  value['LCBuilderCommit'] = commit
                  fmt = plistlib.FMT_BINARY if before.startswith(b'bplist00') else plistlib.FMT_XML
                  after = plistlib.dumps(value, fmt=fmt, sort_keys=False)
                  path.write_bytes(after)
                  if plistlib.loads(path.read_bytes()) != value:
                      raise ValueError('Builder metadata write verification failed')
                  records.append({'path': str(path), 'previous': previous, 'LCBuilderCommit': commit,
                      'CFBundleShortVersionString': value.get('CFBundleShortVersionString'),
                      'CFBundleVersion': value.get('CFBundleVersion'),
                      'before_sha256': hashlib.sha256(before).hexdigest(),
                      'after_sha256': hashlib.sha256(after).hexdigest()})
          pathlib.Path('package-evidence/builder-stamping.json').write_text(json.dumps({
              'meaning': 'Native compile workflow commit; dependency owners remain identified by compile receipt',
              'intentional_post_retention_metadata_change': True, 'files': records}, indent=2) + '\n')
          # Product label is separate from the unchanged embedded upstream versions.
          receipt = json.loads(pathlib.Path('package-evidence/native-receipt.json').read_text())
          label = {
              'product_version': '6.0',
              'channel': 'experimental',
              'label': '6.0 pairing and deferred setup experimental',
              'native_compile_run': str(receipt['run_id']),
              'native_compile_attempt': str(receipt['run_attempt']),
              'native_workflow_commit': commit,
              'source_graph': receipt['requested_graph'],
              'retained_input_versions_unchanged': True,
              'retained_input_bundle_versions': [{k: row[k] for k in
                  ('path', 'CFBundleShortVersionString', 'CFBundleVersion')} for row in records],
              'scope': 'Experimental combined package; compile/static validation is not device sign-in proof.'
          }
          label_bytes = (json.dumps(label, indent=2, sort_keys=True) + '\n').encode()
          pathlib.Path('package-evidence/build-label.json').write_bytes(label_bytes)
          pathlib.Path('diagnostic/build-label.json').write_bytes(label_bytes)
          PY
          python3 builder/scripts/package_livecontainer_combined.py \
            --root host \
            --host unpacked/LiveContainer/native-transfer-LiveContainer/Products/LiveContainer.app \
            --side unpacked/SideStore/native-transfer-SideStore/Products/SideStore.app \
            --output diagnostic/LiveContainer-SideStore-6.0-refresh-diagnostics-experimental.ipa 2>&1 | tee package-evidence/packaging.log
          shasum -a 256 diagnostic/LiveContainer-SideStore-6.0-refresh-diagnostics-experimental.ipa > diagnostic/SHA256SUMS
          stat -f%z diagnostic/LiveContainer-SideStore-6.0-refresh-diagnostics-experimental.ipa > diagnostic/size-bytes.txt
          test "$(cat diagnostic/size-bytes.txt)" -lt 524288000
          # Wrapper itself checks conversion, entitlements, identities and resources.
          # This is a diagnostic candidate, not proof that sign-in works on device.
      - name: Preserve packaging evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-package-evidence-${{ github.run_id }}
          path: package-evidence/
          if-no-files-found: error
      - name: Retain successfully verified diagnostic IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-ipa-${{ github.run_id }}
          path: diagnostic/
          compression-level: 0
          if-no-files-found: error
