# Inert template only. Native run/attempt and independently reviewed artifacts remain unbound.
# Publish only after its success/artifact review. No native rebuild or public release.
name: Package retained pairing and deferred setup experimental apps
on:
  push:
    branches: [validation/package-refresh-failure-preservation-recovery-20261022]
    paths: ['.github/workflows/package-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.repository == 'NRG-Wardog/LiveContainer' && github.ref == 'refs/heads/validation/package-refresh-failure-preservation-recovery-20261022'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      PYTHONOPTIMIZE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      REVIEWED_NATIVE_RECEIPT_SHA256: '50ca57158951092f602955c3de5fa58b426ed9d8f05e7bebea80c5962f22746a'
      REVIEWED_LIVECONTAINER_UNSIGNED_SHA256: 'b1768fa7d53e3b39551c82d502e11b30135a919c2f0a7219b298352ba5502797'
      REVIEWED_SIDESTORE_UNSIGNED_SHA256: '9431af4fd98243dcd63ebb62068e235e11ab22c1579295c7954ee80d853fcb81'
      REVIEWED_COMPREHENSIVE_REPORT_SHA256: '8f04819f85017d969f7c9c89a555df4a247e05d559fda9a89cb38d151398baa0'
    steps:
      - name: Require independently reviewed native artifact bindings
        shell: bash
        run: |
          set -euo pipefail
          for key in REVIEWED_NATIVE_RECEIPT_SHA256 REVIEWED_LIVECONTAINER_UNSIGNED_SHA256 REVIEWED_SIDESTORE_UNSIGNED_SHA256 REVIEWED_COMPREHENSIVE_REPORT_SHA256; do
            [[ "${!key}" =~ ^[0-9a-f]{64}$ ]] || { echo "Native artifact review is still pending: $key" >&2; exit 1; }
          done
      - name: Fetch pinned existing packaging implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/sidestore-auto-refresh
          ref: 3edd9fa523a223bcd2898d5c960c5da7ff335be8
          path: builder
          persist-credentials: false
          submodules: false
      - name: Fetch exact host packaging scripts and entitlements
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/LiveContainer
          ref: cb21f150e8907d2f8ed1bc7658342bac3fbb9926
          path: host
          persist-credentials: false
          submodules: false
      - name: Download only matching successful native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_RUN: '39825696912'
          COMPILE_COMMIT: 'deba71bcac44b1adc1da95c7b2db2f60a2300211'
          COMPILE_ATTEMPT: '1'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMPILE_RUN" =~ ^[0-9]+$ && "$COMPILE_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$COMPILE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          mkdir package-evidence downloads unpacked diagnostic
          gh api "repos/NRG-Wardog/LiveContainer/actions/runs/$COMPILE_RUN" > package-evidence/compile-run.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('package-evidence/compile-run.json'))
          if r.get('workflow_id') != 390741603:
              raise ValueError('Wrong exact native workflow identity')
          if (r['head_sha'] != os.environ['COMPILE_COMMIT'] or
              r['run_attempt'] != int(os.environ['COMPILE_ATTEMPT']) or
              r['conclusion'] != 'success' or r['path'] != '.github/workflows/native-app-compile.yml' or
              r['head_branch'] != 'validation/native-refresh-failure-preservation-recovery-20261022'):
              raise ValueError('Not the requested successful native compile')
          PY
          cat > package-evidence/zip_preflight.py <<'PY'
          import pathlib, posixpath, stat, zipfile
          
          def preflight(archive, owner):
              root = 'native-transfer-' + owner
              links = {}
              paths = set()
              with zipfile.ZipFile(archive) as z:
                  entries = z.infolist()
                  if len(entries) > 100000 or sum(i.file_size for i in entries) > 4 * 1024**3:
                      raise ValueError('Archive exceeds bounded transfer inventory')
                  for i in entries:
                      name = i.filename.rstrip('/')
                      parts = pathlib.PurePosixPath(name).parts
                      if (not name or name.startswith('/') or '\\' in name or
                          '\x00' in name or any(p in ('..', '.', '') for p in name.split('/')) or name in paths):
                          raise ValueError('Unsafe or duplicate ZIP path')
                      if parts[0] not in (root, '__MACOSX'):
                          raise ValueError('Unexpected ZIP root')
                      paths.add(name)
                      mode = i.external_attr >> 16
                      kind = stat.S_IFMT(mode)
                      if kind not in (0, stat.S_IFREG, stat.S_IFDIR, stat.S_IFLNK):
                          raise ValueError('Unsupported ZIP entry type')
                      if kind == stat.S_IFLNK:
                          if parts[0] == '__MACOSX' or name == root or i.file_size > 4096:
                              raise ValueError('Unexpected ZIP symlink')
                          target = z.read(i).decode('utf-8')
                          if not target or target.startswith('/') or '\\' in target or '\x00' in target:
                              raise ValueError('Unsafe ZIP symlink target')
                          links[name] = target
                  if root not in paths:
                      raise ValueError('Missing transfer root')
                  def resolved(name):
                      pending = name.split('/')
                      stack = []
                      expansions = 0
                      while pending:
                          part = pending.pop(0)
                          if part in ('', '.'):
                              continue
                          if part == '..':
                              if len(stack) <= 1: raise ValueError('Escaping ZIP symlink')
                              stack.pop()
                              continue
                          stack.append(part)
                          prefix = '/'.join(stack)
                          if prefix in links:
                              expansions += 1
                              if expansions > 64: raise ValueError('Cyclic or excessive ZIP symlink chain')
                              stack.pop()
                              pending = links[prefix].split('/') + pending
                      return '/'.join(stack)
                  for name in paths:
                      if name == root or name.startswith(root + '/'):
                          target = resolved(name)
                          if target != root and not target.startswith(root + '/'):
                              raise ValueError('Escaping ZIP entry')
                  # Metadata is read only from real regular files, never archive symlinks.
                  for required in ('evidence/receipt.json', 'evidence/product-hashes.json', 'retained-files.json'):
                      name = root + '/' + required
                      if name not in paths or resolved(name) != name:
                          raise ValueError('Missing or linked transfer metadata')
                      item = z.getinfo(name)
                      if stat.S_IFMT(item.external_attr >> 16) not in (0, stat.S_IFREG):
                          raise ValueError('Transfer metadata is not regular')
          PY
          for owner in LiveContainer SideStore; do
            gh run download "$COMPILE_RUN" --repo NRG-Wardog/LiveContainer \
              --name "unsigned-$owner-$COMPILE_COMMIT-$COMPILE_RUN-$COMPILE_ATTEMPT" --dir "downloads/$owner"
            (cd "downloads/$owner" && shasum -a 256 -c SHA256SUMS)
            if [[ "$owner" = LiveContainer ]]; then reviewed="$REVIEWED_LIVECONTAINER_UNSIGNED_SHA256"; else reviewed="$REVIEWED_SIDESTORE_UNSIGNED_SHA256"; fi
            printf '%s  %s\n' "$reviewed" "downloads/$owner/$owner-unsigned.zip" | shasum -a 256 -c -
            python3 - "$owner" <<'PY'
          import sys
          sys.path.insert(0, 'package-evidence')
          from zip_preflight import preflight
          preflight('downloads/' + sys.argv[1] + '/' + sys.argv[1] + '-unsigned.zip', sys.argv[1])
          PY
            mkdir "unpacked/$owner"
            ditto -x -k "downloads/$owner/$owner-unsigned.zip" "unpacked/$owner"
          done
      - name: Verify retained native input identities and bytes
        env:
          COMPILE_RUN: '39825696912'
          COMPILE_COMMIT: 'deba71bcac44b1adc1da95c7b2db2f60a2300211'
          COMPILE_ATTEMPT: '1'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = 3edd9fa523a223bcd2898d5c960c5da7ff335be8
          test "$(git -C host rev-parse HEAD)" = cb21f150e8907d2f8ed1bc7658342bac3fbb9926
          test -z "$(git -C builder status --porcelain)"
          test -z "$(git -C host status --porcelain)"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat
          def inventory(root):
              result = {}
              canonical = root.resolve(strict=True)
              for p in [root, *sorted(root.rglob('*'))]:
                  mode = p.lstat().st_mode
                  row = {'mode': stat.S_IMODE(mode)}
                  if stat.S_ISLNK(mode):
                      target = os.readlink(p)
                      if os.path.isabs(target) or not p.resolve(strict=True).is_relative_to(canonical):
                          raise ValueError('Unbounded retained symlink')
                      row.update(kind='symlink', target=target)
                  elif stat.S_ISDIR(mode): row['kind'] = 'directory'
                  elif stat.S_ISREG(mode): row.update(kind='file', sha256=hashlib.sha256(p.read_bytes()).hexdigest())
                  else: raise ValueError('Unsupported retained entry')
                  result[p.relative_to(root).as_posix()] = row
              return result
          expected_graph = {
              "AnisetteKit": [
                  "NRG-Wardog/AnisetteKit",
                  "3e670c2e1b72ff328d3a64353d8de2418df87e73"
              ],
              "LiveContainer": [
                  "NRG-Wardog/LiveContainer",
                  "cb21f150e8907d2f8ed1bc7658342bac3fbb9926"
              ],
              "LiveContainer/OpenSSL": [
                  "krzyzanowskim/OpenSSL",
                  "623c84da314e85363236507ca38a4bde65df21c3"
              ],
              "LiveContainer/litehook": [
                  "LiveContainerMirror/litehook",
                  "a7e9f599d7f0b3d77008ad62bf10cb10dab6eca9"
              ],
              "SideStore": [
                  "NRG-Wardog/SideStore",
                  "638fa62ce2a540efe6c92dd20c282c32ddc0b2e6"
              ],
              "SideStore/Dependencies/SideSign": [
                  "NRG-Wardog/SideSign",
                  "d05efa30f37bad7c7ddaa50186fc1ac8ba703eca"
              ],
              "SideStore/Dependencies/minimuxer": [
                  "NRG-Wardog/minimuxer",
                  "1d033920660c6f50b8f30c4c333f025867cd9e96"
              ],
              "idevice": [
                  "NRG-Wardog/idevice",
                  "774f02a6d29777c85400f4ba7fa69c12b4227fb3"
              ],
              "idevice/cpp/plist_ffi": [
                  "jkcoxson/plist_ffi",
                  "66e6e6362b58bc361725c3e1b0a34af498aa2b3a"
              ],
              "jktcp": [
                  "NRG-Wardog/jktcp",
                  "a46594f6af56b66b6d9342ed9f5ee6d1b7fb9cc9"
              ]
          }
          receipts = []
          for owner in ('LiveContainer', 'SideStore'):
              root = pathlib.Path('unpacked') / owner / ('native-transfer-' + owner)
              if root.is_symlink() or not root.is_dir(): raise ValueError('Invalid transfer root')
              inventory(root)
              receipt = json.loads((root / 'evidence/receipt.json').read_text())
              if (receipt['status'] != 'COMPILE_ONLY_PASS_REQUIRES_REVIEW' or
                  str(receipt['run_id']) != os.environ['COMPILE_RUN'] or
                  str(receipt['run_attempt']) != os.environ['COMPILE_ATTEMPT'] or
                  receipt['workflow_commit'] != os.environ['COMPILE_COMMIT']):
                  raise ValueError('Retained receipt mismatch')
              if receipt['requested_graph'] != expected_graph:
                  raise ValueError('Retained source graph differs from exact reviewed pins')
              for name, expected_hash in receipt['evidence_sha256'].items():
                  if pathlib.PurePosixPath(name).name != name: raise ValueError('Invalid evidence name')
                  evidence_file = root / 'evidence' / name
                  if evidence_file.is_symlink() or not evidence_file.is_file(): raise ValueError('Invalid evidence file')
                  if hashlib.sha256(evidence_file.read_bytes()).hexdigest() != expected_hash:
                      raise ValueError('Compile evidence checksum mismatch: ' + name)
              graph_file = root / 'evidence/requested-graph.json'
              if ('requested-graph.json' not in receipt['evidence_sha256'] or
                  graph_file.is_symlink() or not graph_file.is_file() or
                  json.loads(graph_file.read_text()) != expected_graph):
                  raise ValueError('Retained graph evidence differs from exact reviewed pins')
              report_dir = root / 'evidence/comprehensive-diagnostics'
              report = report_dir / 'report.json'
              if report_dir.is_symlink() or not report_dir.is_dir() or report.is_symlink() or not report.is_file():
                  raise ValueError('Invalid comprehensive diagnostic report path')
              report_hash = hashlib.sha256(report.read_bytes()).hexdigest()
              if (report_hash != receipt.get('comprehensive_diagnostics_report_sha256') or
                  report_hash != os.environ['REVIEWED_COMPREHENSIVE_REPORT_SHA256']):
                  raise ValueError('Comprehensive diagnostic report checksum mismatch')
              diagnostic_report = json.loads(report.read_text())
              if diagnostic_report.get('status') != 'SOURCE_OWNED_FAKE_DIAGNOSTICS_PASS_NOT_RUNTIME_VALIDATION':
                  raise ValueError('Comprehensive diagnostic report is not passing')
              # The exact independently reviewed report remains authoritative.
              # Require the added narrow suites and their frozen case closure too;
              # these are fake-boundary checks, never on-device sign-in evidence.
              expected_suites = ['legacy-response-core', 'auth-request', 'iloader-auth-parity', 'iloader-onboarding-scope', 'profile-provenance', 'wire-copy', 'placed-pairing', 'deferred-device-setup']
              expected_commands = ["legacy-generate", "legacy-compile", "legacy-run", "auth-source", "auth-generate", "auth-compile", "auth-run", "iloader-source", "iloader-generate", "iloader-compile", "iloader-run", "onboarding-source", "onboarding-generate", "onboarding-compile", "onboarding-run", "profile-source", "profile-generate", "profile-compile", "profile-run", "wire-source", "wire-generate", "wire-service-compile", "wire-host-compile", "wire-service-run", "wire-host-run", "refresh-generate", "refresh-compile", "refresh-run", "extension-generate", "extension-compile", "extension-run", "extension-negative-compile", "extension-negative-run", "pairing-source", "pairing-generate", "pairing-compile", "pairing-run", "recovery-source", "recovery-generate", "recovery-compile", "recovery-run", "deferred-prior-extract", "deferred-prior-generate", "deferred-prior-compile", "deferred-prior-run", "deferred-source", "deferred-generate", "deferred-compile", "deferred-run"]
              expected_setup_cases = {"deferred-device-setup": ["background_retry_reauth_and_skip_modes_never_defer", "cancellation_before_or_during_activation_never_succeeds", "configured_success_registers_and_completes", "deferred_completion_skips_resign_and_postauth", "failed_activation_never_publishes_deferred_success", "fresh_pem_real_proof_finalization_terminal_and_export", "missing_pairing_defers_after_certificate_and_checked_activation", "network_udid_portal_and_certificate_failures_never_defer", "present_invalid_empty_and_unreadable_never_defer", "real_proof_rejects_wrong_malformed_and_truncated_keys", "reloaded_pkcs1_and_pkcs8_real_proof_finalization_terminal_and_export", "reset_pairing_defers_without_adopting_stale_record", "service_terminal_and_export_reject_mismatched_ownership", "stale_identity_wrong_team_or_key_never_activates", "wire_outcome_allowlist_preserves_incomplete_journal"], "placed-pairing": ["activation-gate-serializes", "actual-live-query-ready", "boot-and-status-preserve-reset", "cached-device-id-is-not-live-proof", "cancelled-startup-retains-adopted-file", "changed-placement-after-commit-stops-transport", "changed-preference-after-commit-not-overwritten", "changed-state-after-live-query-not-ready", "cleanup-uncertainty-retains-file-and-hold", "commit-cancellation-preserves-reset", "conflicting-destination-preserved", "diagnostics-do-not-contain-pairing-data", "different-live-device-not-ready", "directory-replacement-rejected", "failed-live-identity-retains-adopted-file", "failed-publication-cleanup-quarantines-leftover", "failed-startup-retains-adopted-file", "fresh-place-explicit-adoption", "invalid-placement-no-mutation", "oversized-file-rejected", "queued-boot-does-not-override-cleanup-uncertain", "queued-boot-does-not-retry-not-ready", "reset-with-no-file-preserved", "stale-before-commit-no-adoption", "symlink-directory-rejected", "symlink-placement-rejected", "verified-existing-copy-adopted"]}
              if (set(expected_setup_cases) != {'placed-pairing', 'deferred-device-setup'} or
                  any(not isinstance(names, list) or not names or
                      any(not isinstance(name, str) or not name for name in names) or
                      len(names) != len(set(names)) for names in expected_setup_cases.values())):
                  raise ValueError('Frozen setup case contract is incomplete')
              if diagnostic_report.get('suites') != expected_suites:
                  raise ValueError('Consolidated diagnostic suite closure differs')
              commands = diagnostic_report.get('commands', [])
              def command_passed(row):
                  if row.get('name') == 'extension-negative-run':
                      return (type(row.get('exit_code')) is int and row['exit_code'] != 0 and
                              row.get('expected_failure_marker') == 'fresh-nil-local-empty-excess-prompts-and-selects: prompt count' and
                              not row.get('timed_out') and not row.get('launch_error'))
                  return row.get('exit_code') == 0 and 'expected_failure_marker' not in row
              if ([row.get('name') for row in commands] != expected_commands or
                  any(not command_passed(row) for row in commands)):
                  raise ValueError('Consolidated diagnostic command closure differs')
              for key in ('live_authentication_executed', 'guest_binary_executed',
                          'native_provider_executed', 'native_linked_tests_executed'):
                  if diagnostic_report.get(key) is not False:
                      raise ValueError('Forbidden runtime claim in retained diagnostic report')
              if (diagnostic_report.get('source_owned_fake_authentication_executed') is not True or
                  diagnostic_report.get('source_input_bytes_unchanged') is not True or
                  diagnostic_report.get('source_inputs_before') != diagnostic_report.get('source_inputs_after')):
                  raise ValueError('Missing fake-only or source immutability evidence')
              exports = diagnostic_report.get('fixture_exports', {})
              if set(exports) != {'iloader-auth-parity', 'iloader-onboarding-scope',
                                 'placed-pairing', 'deferred-device-setup'}:
                  raise ValueError('Retained fixture export closure differs')
              for suite, names in expected_setup_cases.items():
                  path = report_dir / suite / 'cases.json'
                  if path.is_symlink() or not path.is_file() or path.parent.is_symlink():
                      raise ValueError('Missing or linked setup case export')
                  case_bytes = path.read_bytes()
                  value = json.loads(case_bytes)
                  cases = value.get('cases')
                  if (value.get('schema') != suite + '-cases-v1' or value.get('fake_only') is not True or
                      not isinstance(cases, list) or any(not isinstance(name, str) for name in cases) or
                      len(cases) != len(set(cases)) or sorted(cases) != sorted(names)):
                      raise ValueError('Setup case export differs from frozen source contract')
                  expected = {'schema': suite + '-cases-v1', 'fake_only': True, 'names': cases,
                              'count': len(cases), 'sha256': hashlib.sha256(case_bytes).hexdigest()}
                  if exports.get(suite) != expected:
                      raise ValueError('Setup case receipt differs from retained bytes')
              # Narrow recovery identities supplement the exact independently admitted report.
              expected_recovery = json.loads(r'''{"baseline_store_sha256": "7f2e5adb99e4e990513152d59c2e7e931d871e4e3c5bbc9f32344a180b4ac19a", "contract_sha256": "0578e786c9d4186592cb650726fd11499e85de7cd75fc5662394195244e652d4", "deferred_baseline": {"input_sha256": {"LiveContainer/LiveContainerSwiftUI/Views/V3UnifiedShell.swift": "9767154ceb1cb7c8ba55548554fd56c675bdd1946824f9480266e3c8f8f8b844", "LiveContainer/SideStoreSupport/SideStore.swift": "500c90f61be0f1b41c4e7ff785ff84080fff56f59a4392123ac8660a549c7b05", "SideStore/AltStore/AppDelegate.swift": "0d78665e470757d56ac1977fcb9d443fc1c43d1d0ed296a21092c02ec1fcac7f", "SideStore/AltStore/Core/Components/Keychain.swift": "9d617b70b9ab8f77e336a9788953eee837692738c08e7c2abae79b286e3265dd", "SideStore/SideStore/Core/Operations/StandaloneOperations/SignInOperation.swift": "e972f41a596e83602f1a6cec3914efb8ab044291abf2f2a31aedc4473f0550c4", "SideStore/SideStore/Core/Pairing/PairingFileManager.swift": "83320f94fcf086627c1f7c104469eacc8852ca4d328916c9a299cfadfb506274"}, "owners": {"LiveContainer": {"commit": "c20d8289bb72fdca07dd08506c37ead6d9da37da", "tree": "5e92e4275c0b59e48662be9966ef8c2a3f7e0e04"}, "SideStore": {"commit": "6c8ae29c0a9448a83ca710ea484d91d6b2d143cd", "tree": "f4955c1e4a510b10b0022f2dc7e81ae4002b56bd"}}}, "pairing_recovery_case_names": ["ack-cancel-retains-owner", "ack-cancelAfterResponse-retains-owner", "ack-epochChanged-retains-owner", "ack-fail-retains-owner", "ack-falseAck-retains-owner", "ack-serviceChanged-retains-owner", "ack-wrongTarget-retains-owner", "baseline-dispatched-snapshot-ack-stale-owner-reproduced", "certificate-import-safe-copy-and-stale-suffix", "cleanup-uncertainty-retains-durable-and-host-owner", "correlation-inner-no-request-context", "correlation-outer-no-request-context", "correlation-unallowlistedOperation-no-request-context", "exact-ack-plus-quiescent-snapshot-retires-owner", "failed-repeat-ack-retains-only-original-success-proof", "finite-recovery-refusal-causes-preserve-jour