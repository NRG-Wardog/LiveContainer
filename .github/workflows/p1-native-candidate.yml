name: P1 cleanup lifecycle regression

# Cleanup-only regression. No simulator, app build, UI matrix or admission.
# The immutable e72fd12d checkpoint retains the prior two-device workflow.
on:
  push:
    branches: [validation/p1-native-basis]
permissions:
  contents: read
concurrency:
  group: p1-native-${{ github.ref }}
  cancel-in-progress: false
env:
  APPROVED_P1_CAPABILITY_INPUTS_SHA256: '0348828535472cebf4626221141a95dd113471c1ea2f2c6f33fcc27f3ee1ccb9'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  p1-cleanup-regression:
    if: github.repository == 'NRG-Wardog/LiveContainer' && github.ref == 'refs/heads/validation/p1-native-basis'
    runs-on: macos-26
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
          set-safe-directory: false
      - name: Verify seal and exercise owned-child cleanup
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -B validation/ci/p1/preflight/cleanup_gate.py \
            --inputs validation/ci/p1/preflight/inputs.json \
            --approved-inputs-sha256 "$APPROVED_P1_CAPABILITY_INPUTS_SHA256" \
            --host-root "$GITHUB_WORKSPACE/validation" \
            --output "$GITHUB_WORKSPACE/p1-cleanup-result"
      - name: Preserve synthetic regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-cleanup-regression-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            p1-cleanup-result/result.json
            p1-cleanup-result/tests.log
          if-no-files-found: error
          retention-days: 30
