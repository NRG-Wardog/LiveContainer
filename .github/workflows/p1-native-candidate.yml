name: P1 direct timeout feedback validation

# One exact-owned timeout case. Original timing and correctness gates remain.
on:
  push:
    branches: [validation/p1-native-basis]
permissions:
  contents: read
concurrency:
  group: p1-native-${{ github.ref }}
  cancel-in-progress: false
env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  APPROVED_P1_CAPABILITY_INPUTS_SHA256: '513381612af07fd1152965ec0af209614ac3cc04c382d3d5b3239ef837f65f56'
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'
  GIT_CONFIG_NOSYSTEM: '1'
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_CONFIG_COUNT: '0'
jobs:
  p1-short-capabilities:
    if: github.repository == 'NRG-Wardog/LiveContainer' && github.ref == 'refs/heads/validation/p1-native-basis'
    strategy:
      fail-fast: false
      matrix:
        device: [phone]
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
          set-safe-directory: false
      - name: Verify sealed capability inputs
        run: |
          set -euo pipefail
          python3 -B validation/ci/p1/direct/entry.py --verify-only \
            --inputs validation/ci/p1/preflight/inputs.json \
            --approved-inputs-sha256 "$APPROVED_P1_CAPABILITY_INPUTS_SHA256" \
            --host-root "$GITHUB_WORKSPACE/validation"
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_runner_source.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_fresh_ui.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_install_observation.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_query_reuse.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_full_recovery.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_structural_tabs.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_observation_snapshot.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_screen_calibration.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_calibration_discovery.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_simctl_capture.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_capture_prerequisites.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_window_capture.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_window_fixture.py -v
          python3 -B -m unittest discover -s validation/ci/p1/preflight -p test_window_bgra.py -v
      - name: Check sealed direct observer primitives
        run: |
          set -euo pipefail
          python3 -B validation/ci/p1/direct/entry.py --stage-only \
            --host-root "$GITHUB_WORKSPACE/validation" \
            --inputs validation/ci/p1/preflight/inputs.json \
            --approved-inputs-sha256 "$APPROVED_P1_CAPABILITY_INPUTS_SHA256" \
            --work "$GITHUB_WORKSPACE/p1-direct-unit-work"
          export PYTHONPATH="$GITHUB_WORKSPACE/p1-direct-unit-work/runtime-source/window-capture-candidate/ci/p1/preflight:$GITHUB_WORKSPACE/p1-direct-unit-work/runtime-source/window-capture-candidate/ci/p1/video"
          direct="$GITHUB_WORKSPACE/p1-direct-unit-work/runtime-source/direct-feedback-local"
          for suite in clock protocol geometry fixture handoff pixels capture analysis; do
            python3 -B -m unittest discover -s "$direct/$suite" -p 'test*.py'
          done
          for test in "$direct"/host/test*.py; do
            # Real pinned production/builder preparation tests run locally;
            # those source checkouts do not exist until the collector acquires them.
            if [[ "$test" != */test_project_setup.py && "$test" != */test_native_prepare.py ]]; then
              python3 -B -m unittest discover -s "$direct/host" -p "$(basename "$test")"
            fi
          done
      - name: Validate one bounded direct timeout case
        id: collect
        timeout-minutes: 22
        run: |
          set -euo pipefail
          python3 -B validation/ci/p1/preflight/budget.py --evidence "$GITHUB_WORKSPACE/p1-capability-evidence" -- \
            python3 -B validation/ci/p1/direct/entry.py \
            --inputs validation/ci/p1/preflight/inputs.json \
            --approved-inputs-sha256 "$APPROVED_P1_CAPABILITY_INPUTS_SHA256" \
            --host-root "$GITHUB_WORKSPACE/validation" \
            --work "$GITHUB_WORKSPACE/p1-window-work" \
            --evidence "$GITHUB_WORKSPACE/p1-capability-evidence"
      - name: Package every original evidence byte into bounded parts
        id: package
        if: always()
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -euo pipefail
          python3 -B validation/ci/p1/direct/entry.py --verify-only \
            --inputs validation/ci/p1/preflight/inputs.json \
            --approved-inputs-sha256 "$APPROVED_P1_CAPABILITY_INPUTS_SHA256" \
            --host-root "$GITHUB_WORKSPACE/validation"
          python3 -B validation/ci/p1/preflight/budget.py --check-package --evidence "$GITHUB_WORKSPACE/p1-capability-evidence"
          python3 -B validation/ci/p1/video/package_evidence.py pack \
            --source "$GITHUB_WORKSPACE/p1-capability-evidence" \
            --output "$GITHUB_WORKSPACE/p1-capability-parts" \
            --collection-outcome "$COLLECTION_OUTCOME" --max-parts 16
      - name: Preserve original-byte reconstruction manifest
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-capability-${{ matrix.device }}-manifest-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: p1-capability-parts/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve original-byte part 000
        if: always() && steps.package.outcome == 'success' && hashFiles('p1-capability-parts/part-000.bin') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-capability-${{ matrix.device }}-part-000-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: p1-capability-parts/part-000.bin
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Preserve original-byte part 001
        if: always() && steps.package.outcome == 'success' && hashFiles('p1-capability-parts/part-001.bin') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
