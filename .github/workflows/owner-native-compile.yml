name: Maintained owner unsigned compile
on:
  push:
    branches: [fix/scheduler-preflight-retry, fix/auth-diagnostic-trim-state]
  pull_request:
    paths:
      - LiveContainerSwiftUI/**
      - SideStoreSupport/**
      - .github/workflows/owner-native-compile.yml
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: recursive
          path: owner
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: NRG-Wardog/sidestore-auto-refresh
          ref: c57eac41c7c8436e1ed22bb45aa694bcde2f233c
          persist-credentials: false
          path: harness
      - name: Record candidate and verify immutable dependency recipe
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          test "$(git -C harness rev-parse HEAD)" = c57eac41c7c8436e1ed22bb45aa694bcde2f233c
          git -C owner rev-parse HEAD | tee evidence/owner-commit.txt
          git -C owner submodule status --recursive | tee evidence/submodules.txt
          xcodebuild -version | tee evidence/xcode.txt
      - name: Generate and qualify canonical OpenSSL inputs without changing gitlinks
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          python3 -B harness/ci/build/openssl/build.py --output "$PWD/lts-host-build" --optimization Os 2>&1 | tee evidence/host-build.log
          python3 -B harness/ci/qualification/crypto/acquire.py --output openssl-qualification-inputs 2>&1 | tee evidence/acquire.log
          python3 -B harness/ci/qualification/crypto/consumer.py acquire --inputs openssl-qualification-inputs 2>&1 | tee evidence/consumer-acquire.log
          python3 -B harness/ci/build/openssl/qualify.py --built lts-host-build --inputs openssl-qualification-inputs --evidence evidence 2>&1 | tee evidence/lts-qualification-driver.log
          python3 -B harness/ci/build/openssl/build_ios.py --output lts-ios-build --archive lts-host-build/openssl-3.5.9.tar.gz --optimization Os 2>&1 | tee evidence/ios-build.log
          python3 -B harness/ci/build/openssl/install_ios.py --built lts-ios-build --consumer owner 2>&1 | tee evidence/install.log
          cp lts-host-build/build-receipt.json evidence/host-receipt.json
          cp lts-ios-build/ios-build-receipt.json evidence/ios-receipt.json
          cp owner/GeneratedDependencies/OpenSSL35/provenance.json evidence/consumer-provenance.json
      - name: Archive actual owner without signing or packaging
        shell: bash
        run: |
          set -euo pipefail
          cd owner
          xcodebuild archive -project LiveContainer.xcodeproj -scheme LiveContainer \
            -archivePath "$RUNNER_TEMP/Owner.xcarchive" -sdk iphoneos -arch arm64 \
            -configuration Release CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../evidence/archive.log
      - name: Preserve diagnostic receipts and logs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-compile-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
