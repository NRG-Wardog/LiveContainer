name: ADI diagnostic dependency validation

on:
  push:
    branches: [validation/adi-production-dependencies]

permissions:
  contents: read

concurrency:
  group: adi-production-dependency-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-graph:
    if: github.repository == 'NRG-Wardog/LiveContainer' && github.ref == 'refs/heads/validation/adi-production-dependencies'
    runs-on: macos-26
    timeout-minutes: 150
    env:
      # Review the exact diagnostic candidate and external source basis before publishing.
      PRODUCTION_PHASE: sidesign
      PRODUCTION_SOURCE_BASIS: diagnostic
      APPROVED_PRODUCTION_INPUTS_SHA256: 20f46c15134d4c460cae66f3f61c2626e8a8878766fc2d091b72606baa03779c
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_COUNT: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          set-safe-directory: false
          path: validation
      - name: Validate exact published phase inputs
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs artifacts/provenance
          python3 -B validation/ci/production/prove_graph.py inputs \
            --phase "$PRODUCTION_PHASE" \
            --inputs "validation/ci/production/inputs-adi-$PRODUCTION_PHASE.json" \
            --approved-sha256 "$APPROVED_PRODUCTION_INPUTS_SHA256" \
            2>&1 | tee artifacts/logs/production-inputs.log
      - name: Capture the actual remote dependency graph
        timeout-minutes: 145
        run: |
          set -euo pipefail
          bash validation/ci/production/run-production.sh "$PRODUCTION_PHASE" \
            "$GITHUB_WORKSPACE/production-work" "$GITHUB_WORKSPACE/artifacts" \
            2>&1 | tee artifacts/logs/production-validation.log
      - name: Preserve genuine locks, logs and source provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adi-production-dependencies-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/logs/**
            artifacts/provenance/**
